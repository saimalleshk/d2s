<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git learning log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>

.center-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 100%;
  background: transparent;
  color: inherit;
  font-family: inherit;
  padding-bottom: 5%;
}

.center-image {
  display: block;
  max-width: 100%;
  max-height: 60vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.center-container h2 {
  font-family: inherit;
  color: inherit;
  margin-top: 1rem;
}
:root{
  --void:#ffffff;
  --panel:#f6f9f9;
  --grid:#eef2f2;
  --orange:#ff7a1a;
  --orange-text:#b34a00;
  --cyan:#3de6d0;
  --cyan-text:#0b6f64;
  --red:#ff5a67;
  --red-text:#c21f2f;
  --text:#1c1c1c;
  --dim:#4f6663;
  --display:"Orbitron","Eurostile","Bank Gothic","Segoe UI",sans-serif;
  --body:"Rajdhani","Barlow Semi Condensed","Segoe UI",Tahoma,sans-serif;
  --data:"Share Tech Mono","Consolas","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--text)}
body{
  font-family:var(--body);font-size:18px;line-height:1.5;min-height:100vh;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 56px}

h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.1em;margin:0 0 24px;
  padding-bottom:12px;border-bottom:2px solid var(--orange)}

.timeline{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--orange)}
.entry{position:relative;margin:0 0 20px}
.entry::before{
  content:"";position:absolute;left:-29px;top:16px;width:14px;height:14px;
  border:2px solid var(--orange);background:var(--node,var(--void));
}
.k-commit{--node:var(--cyan)}
.k-action{--node:var(--orange)}
.k-fix{--node:var(--red)}
.k-note{--node:var(--void)}

.card{background:var(--panel);border:1px solid var(--orange);padding:12px 16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--data);font-size:14px;color:var(--dim)}
.tag{padding:0 8px;border:1px solid currentColor}
.k-commit .tag{color:var(--cyan-text)}
.k-action .tag{color:var(--orange-text)}
.k-fix .tag{color:var(--red-text)}
.k-note .tag{color:var(--dim)}
h2{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.4;margin:8px 0 4px;overflow-wrap:anywhere}
.card p{margin:0;color:var(--orange-text);font-size:17px}

@media (max-width:600px){h2{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Git learning log</h1>
  

<div class="center-container">
  <img src="justiceleague.jpeg" alt="Image" class="center-image" />
  
</div>

  <ol class="timeline">

    <!--
      TO ADD AN ENTRY: copy one <li> block below, paste it at the TOP of this list
      (newest first), then change three things: the class (k-commit, k-action, k-fix or k-note),
      the tag text and date, and the h2 text. The <p> line is optional.

    <li class="entry k-commit">
      <div class="card">
        <div class="row"><span class="tag">commit</span><time datetime="2026-10-12">12 Oct 2026</time></div>
        <h2>What I did</h2>
        <p>Optional extra line</p>
      </div>
    </li>
    -->

    <li class="entry k-commit">
      <div class="card">
        <div class="row">
          <span class="tag">
          
            3
          
          </span>
        
      </div>
    </li>

    <li class="entry k-commit">
      <div class="card">
        <div class="row">
          <span class="tag">
            4
          </span>
      </div>
    </li>

    <li class="entry k-commit">
      <div class="card">
        <div class="row">
          <span class="tag">
            4
          </span>
      </div>
    </li>

  </ol>
</div>
</body>
</html>
