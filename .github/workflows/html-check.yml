
name: HTML Validation

on:
  push:
    paths:
      - "todo-plain/**"
      - ".github/workflows/html-check.yml"
  pull_request:
    paths:
      - "todo-plain/**"
      - ".github/workflows/html-check.yml"

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Run HTML validator
        run: npx --yes html-validate@10 todo-plain/index.html
